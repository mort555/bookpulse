
[project]
name = "bookpulse"
version = "0.1.0"
description = "BookPulse — Price Monitoring and Margin Analytics Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "beautifulsoup4>=4.12.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "lxml>=5.3.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.0",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "scrapy>=2.12.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.0",
    "fakeredis>=2.26.0",
    "httpx>=0.28.0",
    "import-linter>=2.1.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "responses>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "T20",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
plugins = []
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Domain must be independent"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.api",
    "app.core",
    "app.infra",
    "app.repositories",
    "app.services",
    "app.tasks",
]

[[tool.importlinter.contracts]]
name = "Application modules must not import main"
type = "forbidden"
source_modules = [
    "app.api",
    "app.core",
    "app.domain",
    "app.infra",
    "app.repositories",
    "app.services",
    "app.tasks",
]
forbidden_modules = ["app.main"]